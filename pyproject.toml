[project]
name = "fysvm"
version = "0.1.0"
description = "Fuzzy rule-space max-margin classifiers built on scikit-learn."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "pandas>=2.3",
    "scipy>=1.16",
    "scikit-learn>=1.8",
    "xlrd>=2.0",
    "farc-hd>=1.1.0",
    "ex-fuzzy>=2.1.5",
    "ex-fuzzy-farchd",
    "matplotlib>=3.9",
    "interpret>=0.6",
    "imodels>=1.3",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
csrq = ["sympy>=1.13"]
csrq-atomic = ["sympy>=1.13", "osqp>=0.6"]

[project.scripts]
fysvm-prepare-datasets = "fysvm.datasets:main"
fysvm-evaluate = "fysvm.evaluation:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "sympy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--import-mode=prepend"]

[tool.uv.sources]
ex-fuzzy-farchd = { git = "https://github.com/asieriko/ex_fuzzy_farchd.git" }
